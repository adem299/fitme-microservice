server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-service
  mongodb:
    uri: ${MONGODB_URL}

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

rabbitmq:
  exchange: 
    name: fitme.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

groq:
  api: 
    url: ${GROQ_API_URL}
    key: ${GROQ_API_KEY}
    max-tokens: 800
    request-interval-ms: 2000